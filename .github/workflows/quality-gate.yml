name: Quality Gate

on:
  push:
    branches:
      - main
      - "codex-*"
      - "feature/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Node.js SaaS Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Verify reference artifacts
        shell: bash
        run: |
          test -f siamchart_raw.csv
          test -f recommended_stocks.csv

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run ci:quality
